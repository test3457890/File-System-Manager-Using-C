name: C build and smoke test
on:
  push:
    branches: [main, improvements/working-file-manager]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile with warnings and sanitizers
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer -g -o file_manager src/file_manager.c
      - name: Exercise file operations
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: |
          printf 'mkdir docs\ncd docs\ntouch notes.txt\npwd\nrename notes.txt ideas.txt\ncd ..\nmkdir archive\nmv docs archive\ntree\nrm archive/docs/ideas.txt\nrm archive/docs\nrm archive\nquit\n' | ./file_manager > output.txt
          grep -q 'Directory created' output.txt
          grep -q 'File created' output.txt
          grep -q 'Renamed' output.txt
          grep -q 'Moved' output.txt
          grep -q 'Removed' output.txt
          ! grep -q '^Error:' output.txt
